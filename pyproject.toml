[project]
name = "orchestragent"
version = "0.1.0"
description = "orch: plan a build with a strong model, implement it in parallel with a cheap one, gate every merge on frozen tests"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# tree-sitter parsers give planners and builders symbol maps in many languages; files in
# any other language are still listed by path.
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
]
keywords = ["coding-agent", "orchestration", "llm", "mcp", "claude", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/Orchestragent/orchestragent"
Issues = "https://github.com/Orchestragent/orchestragent/issues"

[project.optional-dependencies]
index = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
orch = "orchestragent.orch_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestragent"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
index = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
]

[tool.uv]
# The index group is optional at runtime (orch_index falls back to ast) but installed by default.
default-groups = ["dev", "index"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests", "conftest.py"]
